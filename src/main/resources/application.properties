spring.application.name=tracker
server.port=${PORT:8080}
spring.datasource.url=${SUPABASE_DB_URL:jdbc:h2:file:./data/trackerdb;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${SUPABASE_DB_USERNAME:sa}
spring.datasource.password=${SUPABASE_DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
app.uploads.directory=${UPLOADS_DIRECTORY:uploads}
app.demo.admin.username=${DEMO_ADMIN_USERNAME:admin}
app.demo.admin.password=${DEMO_ADMIN_PASSWORD:admin123}
app.demo.maintenance.username=${DEMO_MAINTENANCE_USERNAME:maintenance}
app.demo.maintenance.password=${DEMO_MAINTENANCE_PASSWORD:maintenance123}
app.demo.departments.electrical.password=${DEMO_ELECTRICAL_PASSWORD:electrical123}
app.demo.departments.plumbing.password=${DEMO_PLUMBING_PASSWORD:plumbing123}
app.demo.departments.water.password=${DEMO_WATER_PASSWORD:water12345}
app.demo.departments.cleaning.password=${DEMO_CLEANING_PASSWORD:cleaning123}
app.demo.departments.lift.password=${DEMO_LIFT_PASSWORD:lift12345}
app.demo.departments.security.password=${DEMO_SECURITY_PASSWORD:security123}
app.demo.departments.general.password=${DEMO_GENERAL_PASSWORD:general123}
