<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Edit profile | Apartment Tracker</title>
  <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
  <header th:replace="~{fragments/navigation :: navigation}"></header>
  <main class="container">
    <div class="page-heading">
      <div>
        <p class="eyebrow">ACCOUNT DETAILS</p>
        <h1>Edit profile</h1>
        <p class="muted">Update details for the signed-in account <strong th:text="${username}">username</strong>.</p>
      </div>
    </div>

    <section class="panel profile-panel">
      <h2>Contact and apartment details</h2>
      <form method="post" th:action="@{/profile}" th:object="${profileForm}" class="form-grid">
        <div>
          <label for="fullName">Full name</label>
          <input id="fullName" th:field="*{fullName}" autocomplete="name" maxlength="100" required>
          <span class="field-error" th:errors="*{fullName}"></span>
        </div>
        <div>
          <label for="phone">Phone number</label>
          <input id="phone" th:field="*{phone}" type="tel" autocomplete="tel" maxlength="30" required>
          <span class="field-error" th:errors="*{phone}"></span>
        </div>
        <div class="wide">
          <div th:if="${apartmentNeedsSelection}">
            <label for="apartmentBlock">Apartment block</label>
            <select id="apartmentBlock" th:field="*{apartmentBlock}" required>
              <option value="">Choose a block (A-Z)</option>
              <option th:each="block : ${apartmentBlocks}" th:value="${block}" th:text="${block}"></option>
            </select>
            <span class="field-error" th:errors="*{apartmentBlock}"></span>
            <label for="apartmentUnit">Apartment number</label>
            <select id="apartmentUnit" th:field="*{apartmentUnit}" required>
              <option value="">Choose an apartment (1-8)</option>
              <option th:each="unit : ${apartmentNumbers}" th:value="${unit}" th:text="${unit}"></option>
            </select>
            <span class="field-error" th:errors="*{apartmentUnit}"></span>
            <p class="hint">Choose your flat to finish setting up your account.</p>
          </div>
          <div th:unless="${apartmentNeedsSelection}">
            <label>Registered apartment</label>
            <p class="muted" th:text="${flatAddress}">A-1</p>
            <p class="hint">Apartment allocation is fixed after registration. Contact the administrator if it needs correction.</p>
          </div>
        </div>
        <div>
          <label for="email">Email <span class="muted">(optional)</span></label>
          <input id="email" th:field="*{email}" type="email" autocomplete="email" maxlength="150">
          <span class="field-error" th:errors="*{email}"></span>
        </div>
        <div>
          <label for="emergencyContactName">Emergency contact name <span class="muted">(optional)</span></label>
          <input id="emergencyContactName" th:field="*{emergencyContactName}" maxlength="100">
          <span class="field-error" th:errors="*{emergencyContactName}"></span>
        </div>
        <div>
          <label for="emergencyContactPhone">Emergency contact phone <span class="muted">(optional)</span></label>
          <input id="emergencyContactPhone" th:field="*{emergencyContactPhone}" type="tel" maxlength="30">
          <span class="field-error" th:errors="*{emergencyContactPhone}"></span>
        </div>
        <div class="wide profile-actions">
          <button type="submit">Save changes</button>
          <a class="text-link" th:href="@{/profile}">Cancel</a>
        </div>
      </form>
    </section>
  </main>
</body>
</html>
