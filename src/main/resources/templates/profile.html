<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My profile | Apartment Tracker</title>
  <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
  <header th:replace="~{fragments/navigation :: navigation}"></header>
  <main class="container">
    <div class="page-heading">
      <div>
        <p class="eyebrow">ACCOUNT DETAILS</p>
        <h1>My profile</h1>
        <p class="muted">Your profile is linked to the signed-in account <strong th:text="${username}">resident</strong>.</p>
      </div>
      <a class="button-link" th:href="@{/profile/edit}">Edit profile</a>
    </div>

    <section class="panel profile-panel">
      <p class="success" th:if="${profileSaved}">Your profile details have been saved.</p>
      <div class="profile-details">
        <div class="profile-detail"><span>Full name</span><strong th:text="${profile.fullName}">Name</strong></div>
        <div class="profile-detail"><span>Username</span><strong th:text="${profile.username}">username</strong></div>
        <div class="profile-detail"><span>Phone number</span><strong th:text="${#strings.isEmpty(profile.phone) ? 'Not provided' : profile.phone}">Phone</strong></div>
        <div class="profile-detail"><span>Apartment / flat</span><strong th:text="${#strings.isEmpty(profile.apartmentNumber) ? 'Not provided' : profile.apartmentNumber}">Apartment</strong></div>
        <div class="profile-detail"><span>Email</span><strong th:text="${profile.email == null ? 'Not provided' : profile.email}">Email</strong></div>
        <div class="profile-detail"><span>Emergency contact</span><strong th:text="${profile.emergencyContactName == null ? 'Not provided' : profile.emergencyContactName}">Contact name</strong></div>
        <div class="profile-detail"><span>Emergency phone</span><strong th:text="${profile.emergencyContactPhone == null ? 'Not provided' : profile.emergencyContactPhone}">Contact phone</strong></div>
      </div>
      <p class="muted profile-updated" th:text="|Last updated ${profile.updatedAt}|">Last updated</p>
    </section>
  </main>
</body>
</html>
